name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      # Vitest starts an in-memory single-node replica set (transactions need one).
      - run: npm test
      - run: npm run build
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/?replicaSet=unused
      # No --with-deps: the runner image already has Chrome's system libraries, and apt mirrors were unreachable.
      - run: npx playwright install chromium
      - run: npm run test:e2e
        env:
          CI: "1"
          E2E_PROD: "1"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
