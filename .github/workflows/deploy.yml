name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

# Validators are applied before production is promoted (moderate, so existing documents never break).
jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    concurrency: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run migrate -- --level moderate
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DB: bb_demo
      - run: npx vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      - name: Smoke check
        run: curl --fail --retry 5 --retry-delay 10 "${{ vars.PRODUCTION_URL }}/api/health"
