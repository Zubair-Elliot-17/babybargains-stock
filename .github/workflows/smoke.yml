name: Post-deploy smoke check
# Vercel reports each finished deployment to GitHub. Deployment URLs (previews and production alike) are
# behind Vercel Authentication, so check the public production domain once it serves this commit.
on: deployment_status

jobs:
  health:
    if: github.event.deployment_status.state == 'success' && github.event.deployment_status.environment == 'Production'
    runs-on: ubuntu-latest
    steps:
      - env:
          SHA: ${{ github.event.deployment.sha }}
        run: |
          url="https://babybargains-stock.vercel.app/api/health"
          for i in $(seq 1 12); do
            body=$(curl --silent --show-error --max-redirs 0 "$url" || true)
            echo "$body"
            # A login redirect or the previous deploy is not a pass.
            echo "$body" | grep -q '"ok":true' && echo "$body" | grep -q "\"commit\":\"$SHA\"" && exit 0
            sleep 10
          done
          exit 1
